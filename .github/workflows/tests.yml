name: Local and simulated tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - name: Python tests
        shell: pwsh
        run: |
          $output = & python -B -m unittest discover -q 2>&1
          $result = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($result -ne 0) {
            $message = ($output -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Python test details::$message"
            exit $result
          }
      - shell: pwsh
        run: |
          $tests = @(Get-ChildItem -File -Filter 'test_*.js' | Select-Object -ExpandProperty Name)
          & node --test $tests
          exit $LASTEXITCODE
